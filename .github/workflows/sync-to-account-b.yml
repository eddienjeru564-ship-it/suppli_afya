
name: Sync to Account B

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to Repository B
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote add target https://x-access-token:${SYNC_TOKEN}@github.com/suppli-afya/suppli_afya-main_site_clone.git
          git push target HEAD:main
